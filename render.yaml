# Render Blueprint for the Workspace API.
#
# This file documents the production shape; it is NOT applied automatically to
# an existing service. Create a new Blueprint environment from it, or copy the
# build/start/health values into the existing Render service. Secrets are
# intentionally `sync: false`: fill them in the Render dashboard, never here.
services:
  - type: web
    name: art-workspace-api
    runtime: python
    rootDir: backend
    # Keep this region aligned with the Supabase database. Cross-region database
    # round-trips were measured at ~1.5s per query in production.
    region: singapore
    # requirements.lock is compiled on CI from requirements.in and carries the
    # SHA-256 of every distribution, so the build installs exactly the runtime
    # set the backend job tested. --require-hashes rejects anything else. It is
    # the runtime set only: pytest, flake8 and mypy live in requirements-dev.lock
    # and never reach this service.
    buildCommand: pip install --upgrade pip && pip install --require-hashes -r requirements.lock
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      # The lock hashes cp311 manylinux wheels, so the runtime has to be 3.11:
      # a newer minor would reject every binary wheel the lock names.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: REGISTRATION_MODE
        value: approval
      # Secure default: Google account creation follows REGISTRATION_MODE.
      # Enable only together with a real domain allow-list.
      - key: GOOGLE_SIGNUP_ENABLED
        value: "false"
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Path to the downloaded Supabase CA on the backend host (or paste the
      # PEM content into SSL_CA_CERT). Required: Supabase forces TLS and its CA
      # is not in certifi, so without this asyncpg falls back to the public
      # bundle and fails certificate verification. Download it from the Supabase
      # Dashboard (Project Settings → Database → SSL Configuration).
      - key: SSL_CA_CERT_PATH
        sync: false
      - key: SSL_CA_CERT
        sync: false
      # Secure default: a remote PostgreSQL without a usable CA refuses to
      # start. Set true only for a throwaway environment.
      - key: ALLOW_INSECURE_DB_TLS
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # AI Copilot. Leave all of these empty to keep the built-in Thai intent
      # engine; set a key to let an external model answer the chat.
      - key: AI_PROVIDER
        value: "auto"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CCTV_MEDIAMTX_URL
        sync: false
      - key: CCTV_CONTROL_SECRET
        sync: false

  # ── CCTV ────────────────────────────────────────────────────────────────────
  # MediaMTX republishes the camera's RTSP stream as HLS, because browsers
  # cannot play RTSP. A Render web service routes one HTTP port, so only the HLS
  # listener is public and every other protocol is disabled.
  #
  # MediaMTX *pulls* the camera, which means CCTV_RTSP_URL must resolve from the
  # public internet: a 192.168.x.x camera is only reachable through a router
  # port-forward (or a public relay) in front of it.
  - type: web
    name: art-workspace-cctv
    runtime: docker
    dockerfilePath: ./mediamtx/Dockerfile
    dockerContext: ./mediamtx
    region: singapore
    # A free instance spins down after 15 idle minutes; the first viewer then
    # waits for a cold start (~1 min) and the camera panel shows its retry
    # state. Use the starter plan if the stream must be up on first open.
    plan: free
    autoDeploy: true
    envVars:
      # Manifest URL becomes https://<service>.onrender.com/{CCTV_PATH}/index.m3u8
      - key: CCTV_PATH
        value: camera1
      # rtsp://<user>:<pass>@<public-host>:554/stream2 — the H.264 substream.
      # /stream1 is H.265, which no browser decodes.
      - key: CCTV_RTSP_URL
        sync: false
      # Origins allowed to read the HLS endpoints; '*' accepts any (then tighten
      # it to the deployed frontend origin).
      - key: CCTV_ALLOWED_ORIGINS
        sync: false
      # Shared secret matching backend CCTV_CONTROL_SECRET so only the API can
      # register/delete dynamic per-user RTSP paths via /_control/*.
      - key: CCTV_CONTROL_SECRET
        sync: false
