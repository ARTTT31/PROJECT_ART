<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0066cc" />
    <title>ออฟไลน์ | ART Workspace</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      main {
        width: min(100%, 420px);
        padding: 36px 28px;
        text-align: center;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 18px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #0066cc;
        color: #fff;
        font-size: 24px;
        font-weight: 800;
      }
      h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: #6e6e73; font-size: 14px; line-height: 1.65; }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #0066cc;
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>ตอนนี้ออฟไลน์อยู่</h1>
      <p>
        ART Workspace ต้องการการเชื่อมต่อเพื่อโหลดข้อมูลล่าสุด
        ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง
      </p>
      <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </main>
    <script>
      window.addEventListener('online', function() {
        location.reload();
      });
    </script>
  </body>
</html>
