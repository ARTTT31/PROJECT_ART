# Dependency updates.
#
# Nothing here is auto-merged: Dependabot opens a pull request and CI (lint,
# type check, backend tests, migration chain, build, smoke tests) decides whether
# it is safe. Grouping keeps the noise low, scheduled monthly to prevent branch clutter.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - backend
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - frontend
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    groups:
      actions-dependencies:
        patterns:
          - "*"
