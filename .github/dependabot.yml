# Dependency updates.
#
# Nothing here is auto-merged: Dependabot opens a pull request and CI (lint,
# type check, backend tests, migration chain, build, smoke tests) decides whether
# it is safe. Grouping keeps the noise low, scheduled monthly to prevent branch clutter.
version: 2
updates:
  # `requirements.txt` is only a shim (`-r requirements.in`, `-r requirements-dev.in`),
  # but Dependabot follows `-r` includes that end in .txt/.in, so every pin in both
  # sets stays visible. It cannot see the `.lock` files (not .txt), so a PR that bumps
  # a pin or raises a ceiling arrives without one and the Lockfile workflow fails it
  # until both locks are regenerated.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - backend
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - frontend
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    groups:
      actions-dependencies:
        patterns:
          - "*"
