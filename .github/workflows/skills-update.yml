name: Skills update

# The lock pins 29 GitHub-sourced skills at exact commits, so an upstream fix
# stays invisible until someone re-resolves on purpose. This opens a PR instead
# of pushing: the skill diffs are reviewed like any other change, and the
# repo-owned (local) skills cannot be touched by it.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # --no-frozen-lockfile is the CLI's own fix for a drifted lock: it
      # re-resolves every GitHub source and rewrites the recorded hashes.
      - name: Re-resolve the GitHub-sourced skills
        run: npx --yes skills@1.9.0 experimental_install --no-frozen-lockfile

      - name: Verify the refreshed tree still passes the gates
        run: |
          node scripts/check_skills_lock.mjs
          node scripts/check_skills_routing.mjs

      # The action pushes the refreshed branch before it asks GitHub to open
      # the pull request, so a blocked PR still leaves the work reachable.
      - name: Open a pull request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(skills): refresh pinned skills from upstream"
          title: "chore(skills): refresh pinned skills from upstream"
          body: |
            Monthly re-resolution of the GitHub-sourced skills in `skills-lock.json`.

            Review the skill diffs before merging. Skills recorded with
            `sourceType: "local"` are repo-owned and never change here.
          branch: chore/skills-refresh
          delete-branch: true
          add-paths: |
            .agents/skills
            skills-lock.json

      # Without this the job dies on the API's one-line error and the fix is not
      # discoverable. Name the switch, then point at the branch already pushed.
      - name: Explain a blocked pull request
        if: steps.pr.outcome == 'failure'
        run: |
          echo "::error::GitHub refused the pull request with 'GitHub Actions is not permitted to create or approve pull requests'."
          echo "Enable Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests',"
          echo "or give this step a token that may open pull requests. The refreshed branch was pushed either way:"
          echo "${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...chore/skills-refresh?expand=1"
          exit 1
