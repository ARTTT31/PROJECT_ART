name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Lint + Test ──────────────────────────────
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend/app --max-line-length=120 --exclude=__pycache__

      - name: Type check with mypy
        working-directory: backend
        run: mypy app

      # The test suite builds its schema from the models, so a broken or forgotten
      # Alembic revision used to pass CI and only fail against the production
      # database. Apply the chain to a throwaway SQLite file, then let `alembic
      # check` compare the resulting schema with the models (drift = non-zero exit).
      - name: Check the Alembic migration chain
        working-directory: backend
        env:
          # Must be >= 32 chars: config.py rejects weak keys when DEBUG=False.
          SECRET_KEY: ci-test-secret-key-for-testing-only
          DATABASE_URL: "sqlite:///./ci-migrations.db"
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend tests
        working-directory: backend
        env:
          # Must be >= 32 chars: config.py rejects weak keys when DEBUG=False.
          SECRET_KEY: ci-test-secret-key-for-testing-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -q --tb=short

  # ── Dependency advisories ─────────────────────────────
  # Advisory, not a merge gate: the pinned set currently reports advisories
  # (starlette via fastapi 0.111, python-jose), and a red build nobody can fix
  # would just get ignored. Dependabot opens the upgrade PRs; this job makes the
  # advisories visible in the meantime. Flip `continue-on-error` to false once
  # the pinned set is clean.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit backend dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

  # ── Frontend: Lint + Type-Check + Build ───────────────
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
