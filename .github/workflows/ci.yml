name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A pinned dependency set can go stale without a single push: a CVE published
  # on a Tuesday is invisible to push-triggered CI until someone commits. The
  # weekly run re-audits the same requirements every Monday at 02:00 UTC.
  schedule:
    - cron: "0 2 * * 1"

jobs:
  # ── Backend: Lint + Test ──────────────────────────────
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend/app --max-line-length=120 --exclude=__pycache__

      - name: Type check with mypy
        working-directory: backend
        run: mypy app

      # The test suite builds its schema from the models, so a broken or forgotten
      # Alembic revision used to pass CI and only fail against the production
      # database. Apply the chain to a throwaway SQLite file, then let `alembic
      # check` compare the resulting schema with the models (drift = non-zero exit).
      - name: Check the Alembic migration chain
        working-directory: backend
        env:
          # Must be >= 32 chars: config.py rejects weak keys when DEBUG=False.
          SECRET_KEY: ci-test-secret-key-for-testing-only
          DATABASE_URL: "sqlite:///./ci-migrations.db"
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend tests
        working-directory: backend
        env:
          # Must be >= 32 chars: config.py rejects weak keys when DEBUG=False.
          SECRET_KEY: ci-test-secret-key-for-testing-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -q --tb=short

  # ── Dependency advisories ─────────────────────────────
  # Merge gate: the pinned set audits clean (the old python-jose / starlette
  # advisories are gone — see the pins in backend/requirements.txt), so a new
  # advisory now fails the build instead of scrolling past as a warning, and the
  # weekly schedule catches advisories published between pushes. No entries are
  # currently ignored; if one ever has to be, add it as an individual
  # `--ignore-vuln <ID>` with the reason and a review date, never a blanket skip.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Audit backend dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

  # ── Frontend: Lint + Type-Check + Build ───────────────
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["26"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # The Vitest unit suite is part of the gate: it has been passing locally
      # for a while but was never wired into this workflow.
      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:8080
          NEXT_PUBLIC_USE_SAME_ORIGIN_API: "true"

      # Serwist only generates the PWA worker through webpack. A production
      # build that silently falls back to Turbopack ships /sw.js as a 404, so
      # fail here instead of discovering it from the browser console.
      - name: Verify PWA worker was generated
        run: test -s public/sw.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      # The signed-out pages are the first thing a visitor sees, so an axe scan
      # gates them: colour contrast on /login regressed once already.
      - name: Run accessibility audit
        run: npx playwright test tests/a11y.spec.ts

      # ── Live auth E2E ─────────────────────────────────────────────────
      # The smoke and auth-flow suites mock the API, so nothing proved a real
      # account can sign in against the Python service. These steps start the
      # backend on SQLite and drive the browser through register → login.
      - name: Set up Python for the live backend
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies for the live E2E
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the backend for the live E2E
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-for-testing-only
          DATABASE_URL: "sqlite+aiosqlite:///./e2e-live.db"
          AUTO_CREATE_TABLES: "true"
          DEBUG: "true"
          REGISTRATION_MODE: "open"
          REQUIRE_EMAIL_VERIFICATION: "false"
          EMAIL_BACKEND: "console"
          COOKIE_SECURE: "false"
          COOKIE_SAMESITE: "lax"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8080 > e2e-backend.log 2>&1 &
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat e2e-backend.log
          exit 1

      - name: Run live auth E2E
        env:
          LIVE_BACKEND_URL: "http://127.0.0.1:8080"
          API_INTERNAL_URL: "http://127.0.0.1:8080"
          NEXT_PUBLIC_USE_SAME_ORIGIN_API: "true"
        run: npx playwright test tests/e2e-live-backend.spec.ts
