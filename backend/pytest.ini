[pytest]
asyncio_mode = auto

# ── Coverage (pytest-cov) ────────────────────────────────────────────────────
# Enable by default. Run `pytest --no-cov` to skip.
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=40
# Don't count test infrastructure / generated code toward coverage
cov_exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    @classmethod\s+def __get_pydantic_core_schema__
